name: Build Cudy TR3600 OpenWrt with Passwall and iStore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip zlib1g-dev file python3

      - name: Clone Source Code
        run: |
          git clone -b agent/cudy-tr3600-v1-6.12 --single-branch https://github.com/soapmancn/openwrt.git openwrt

      - name: Add iStore Feed and Install Feeds
        run: |
          cd openwrt
          echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -d y -p istore luci-app-store

      - name: Generate and Validate TR3600 Config
        run: |
          cd openwrt
          cat <<EOF > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
          CONFIG_PACKAGE_luci-app-store=y
          EOF
          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y$' .config
          ! grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_openwrt_one=y$' .config

      - name: Download Package Dependencies
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Validate and Collect TR3600 Firmware
        run: |
          cd openwrt
          target_dir=bin/targets/mediatek/filogic
          test -n "$(find "$target_dir" -maxdepth 1 -type f -name '*cudy_tr3600-v1*sysupgrade.bin' -print -quit)"
          mkdir -p firmware
          find "$target_dir" -maxdepth 1 -type f -name '*cudy_tr3600-v1*' -exec cp {} firmware/ \;
          sha256sum firmware/* > firmware/SHA256SUMS
          ls -lh firmware

      - name: Upload TR3600 Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cudy-TR3600-V1-Firmware-with-iStore
          path: openwrt/firmware/*
          retention-days: 7
